{{ define "main" }}
<div class="p-4 p-md-5 mb-4 bg-light rounded-3">
  <h1>{{ .Title }}</h1>
  {{ .Content }}
</div>

<div class="row row-cols-1 row-cols-md-3 g-4">
  {{ range .Site.Data.home_cards }}
  {{ $card := . }}
  <div class="col">
    <div class="card h-100">
      <div class="card-body">
        <h5 class="card-title">{{ .title }}</h5>
        {{ with .image }}
        <img src="{{ . | relURL }}" alt="{{ $card.imageAlt }}" class="img-fluid rounded mb-2">
        {{ end }}
        {{ if .text }}
        <p class="card-text">{{ .text }}</p>
        {{ else }}
        <p class="card-text">{{ .textBefore }}<a href="{{ .linkURL | relURL }}">{{ .linkText }}</a>{{ .textAfter }}</p>
        {{ end }}
      </div>
    </div>
  </div>
  {{ end }}
</div>
{{ end }}

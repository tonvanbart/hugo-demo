{{ define "main" }}
<h1>{{ .Title }}</h1>
<p>Meld je hieronder aan. Aanmeldingen worden via
  <a href="https://formspree.io/">Formspree</a> verwerkt.</p>

<form id="signup-form" class="row g-3 needs-validation" novalidate style="max-width: 32rem;">
  <div class="col-12">
    <label for="name" class="form-label">Naam</label>
    <input type="text" class="form-control" id="name" name="name" required>
    <div class="invalid-feedback">Vul je naam in.</div>
  </div>
  <div class="col-12">
    <label for="email" class="form-label">E-mailadres</label>
    <input type="email" class="form-control" id="email" name="email" required>
    <div class="invalid-feedback">Vul een geldig e-mailadres in.</div>
  </div>
  <fieldset class="col-12">
    <legend class="form-label fs-6">Vegetarisch?</legend>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="vegetarian" id="vegetarian-yes" value="ja" required>
      <label class="form-check-label" for="vegetarian-yes">Ja</label>
    </div>
    <div class="form-check form-check-inline">
      <input class="form-check-input" type="radio" name="vegetarian" id="vegetarian-no" value="nee" required>
      <label class="form-check-label" for="vegetarian-no">Nee</label>
    </div>
  </fieldset>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Aanmelden</button>
  </div>
  <div class="col-12">
    <div id="signup-status" class="mt-2"></div>
  </div>
</form>

<script>
(function () {
  var endpoint = {{ .Site.Params.formspreeEndpoint }};
  var form = document.getElementById("signup-form");
  var status = document.getElementById("signup-status");
  var button = form.querySelector("button[type=submit]");

  // Uses textContent so user input (e.g. the name) is never parsed as HTML.
  function showAlert(type, message) {
    var alert = document.createElement("div");
    alert.className = "alert alert-" + type;
    alert.setAttribute("role", "alert");
    alert.textContent = message;
    status.replaceChildren(alert);
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    event.stopPropagation();

    form.classList.add("was-validated");
    if (!form.checkValidity()) { return; }

    if (!endpoint) {
      showAlert("warning", "Er is nog geen Formspree-endpoint geconfigureerd " +
        "(Site.Params.formspreeEndpoint is leeg).");
      return;
    }

    var data = new FormData(form);
    var name = data.get("name");

    showAlert("info", "Bezig met verzenden…");
    button.disabled = true;

    // Accept: application/json makes Formspree answer with JSON instead of
    // redirecting to its own thank-you page.
    fetch(endpoint, {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: data
    })
      .then(function (response) {
        if (response.ok) {
          showAlert("success", "Bedankt, " + name + "! Je bent aangemeld.");
          form.reset();
          form.classList.remove("was-validated");
          return;
        }
        return response.json().then(function (body) {
          var messages = (body && body.errors || []).map(function (e) { return e.message; });
          throw new Error(messages.join(", ") || "Verzoek mislukt: " + response.status);
        });
      })
      .catch(function (err) {
        showAlert("danger", "Er is iets misgegaan: " + err.message);
      })
      .finally(function () {
        button.disabled = false;
      });
  });
})();
</script>
{{ end }}

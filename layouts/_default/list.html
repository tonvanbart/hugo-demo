{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

<div class="mt-4">
  {{ range .Pages.ByDate.Reverse }}
  <article class="py-4 border-bottom">
    <h2 class="h4 mb-1"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
    {{ if .Date }}<p class="text-muted small mb-2">{{ .Date | time.Format ":date_long" }}</p>{{ end }}
    <p class="mb-0">{{ .Params.summary | default (.Summary) }}</p>
  </article>
  {{ end }}
</div>
{{ end }}

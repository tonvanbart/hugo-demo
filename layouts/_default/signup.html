{{ define "main" }}
<h1>{{ .Title }}</h1>
<p>Meld je hieronder aan. Aanmeldingen worden naar een kleine serverless functie
  (Google Apps Script) gestuurd, die elke inzending aan een Google Sheet toevoegt.</p>

<form id="signup-form" class="row g-3 needs-validation" novalidate style="max-width: 32rem;">
  <div class="col-12">
    <label for="name" class="form-label">Naam</label>
    <input type="text" class="form-control" id="name" name="name" required>
    <div class="invalid-feedback">Vul je naam in.</div>
  </div>
  <div class="col-12">
    <label for="email" class="form-label">E-mailadres</label>
    <input type="email" class="form-control" id="email" name="email" required>
    <div class="invalid-feedback">Vul een geldig e-mailadres in.</div>
  </div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Aanmelden</button>
  </div>
  <div class="col-12">
    <div id="signup-status" class="mt-2"></div>
  </div>
</form>

<script>
(function () {
  var endpoint = {{ .Site.Params.formEndpoint }};
  var form = document.getElementById("signup-form");
  var status = document.getElementById("signup-status");

  // Uses textContent so user input (e.g. the name) is never parsed as HTML.
  function showAlert(type, message) {
    var alert = document.createElement("div");
    alert.className = "alert alert-" + type;
    alert.setAttribute("role", "alert");
    alert.textContent = message;
    status.replaceChildren(alert);
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    event.stopPropagation();

    if (!form.checkValidity()) {
      form.classList.add("was-validated");
      return;
    }
    form.classList.add("was-validated");

    if (!endpoint) {
      status.innerHTML = '<div class="alert alert-warning" role="alert">' +
        'Er is nog geen formulierbackend geconfigureerd (Site.Params.formEndpoint is leeg). ' +
        'In een echte deployment zou het formulier de gegevens via een POST naar de URL ' +
        'van een Google Apps Script-webapp sturen.' +
        '</div>';
      return;
    }

    var data = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value
    };

    status.innerHTML = '<div class="alert alert-info" role="alert">Bezig met verzenden&hellip;</div>';

    // text/plain keeps this a CORS "simple request": a JSON content type would
    // trigger an OPTIONS preflight, which Apps Script doesn't answer. The body
    // is still JSON; the script parses e.postData.contents as before.
    fetch(endpoint, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    })
      .then(function (response) {
        if (!response.ok) { throw new Error("Verzoek mislukt: " + response.status); }
        showAlert("success", "Bedankt, " + data.name + "! Je bent aangemeld.");
        form.reset();
        form.classList.remove("was-validated");
      })
      .catch(function (err) {
        showAlert("danger", "Er is iets misgegaan: " + err.message);
      });
  });
})();
</script>
{{ end }}
